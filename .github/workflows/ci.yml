name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: make image

      - name: Build EFI image
        run: make build

      - name: Run tests
        run: make test

      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf
          OVMF_CODE=$(find /usr/share -iname 'OVMF_CODE*.fd' 2>/dev/null | sort | head -n1)
          echo "Using OVMF_CODE=$OVMF_CODE"
          test -n "$OVMF_CODE"
          echo "OVMF_CODE=$OVMF_CODE" >> $GITHUB_ENV

      - name: "Run Lisp tests in QEMU (milestone 1: base)"
        timeout-minutes: 5
        run: make test-qemu-milestone OVMF_CODE="$OVMF_CODE" MILESTONE=test/lisp/qemu_boot_m1_base.lisp

      - name: "Run Lisp tests in QEMU (milestone 2: za base)"
        timeout-minutes: 20
        run: make test-qemu-milestone OVMF_CODE="$OVMF_CODE" MILESTONE=test/lisp/qemu_boot_m2_za.lisp

      - name: "Run Lisp tests in QEMU (milestone 3: za ext5 non-local-exit)"
        timeout-minutes: 10
        run: make test-qemu-milestone OVMF_CODE="$OVMF_CODE" MILESTONE=test/lisp/qemu_boot_m3_za_ext5.lisp

      - name: "Run Lisp tests in QEMU (milestone 4: environment)"
        timeout-minutes: 10
        run: make test-qemu-milestone OVMF_CODE="$OVMF_CODE" MILESTONE=test/lisp/qemu_boot_m4_environment.lisp

      - name: "Run Lisp tests in QEMU (milestone 5: IDE/ATA PIO block device)"
        timeout-minutes: 10
        run: make test-qemu-milestone OVMF_CODE="$OVMF_CODE" MILESTONE=test/lisp/qemu_boot_m5_ide.lisp

      - name: "Run Lisp tests in QEMU (FAT16-M0: bitwise ops / char-code subprimitives)"
        timeout-minutes: 10
        run: make test-qemu-milestone OVMF_CODE="$OVMF_CODE" MILESTONE=test/lisp/qemu_boot_fat16_m0.lisp

      - name: "Run Lisp tests in QEMU (FAT16-M1/M2/M3/M4: BPB parse / root dir / cluster chain / file read)"
        timeout-minutes: 10
        run: make test-qemu-milestone OVMF_CODE="$OVMF_CODE" MILESTONE=test/lisp/qemu_boot_m6_fat16.lisp QEMU_DISK_IMG=tmp/fat16_test.img
