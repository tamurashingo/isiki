name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build docker image
        run: make image

      - name: Build EFI image
        run: make build

      - name: Run tests
        run: make test

      - name: Install QEMU and OVMF firmware
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Run Lisp tests in QEMU
        timeout-minutes: 10
        run: |
          OVMF_CODE=$(find /usr/share -iname 'OVMF_CODE*.fd' 2>/dev/null | sort | head -n1)
          echo "Using OVMF_CODE=$OVMF_CODE"
          test -n "$OVMF_CODE"
          make test-qemu OVMF_CODE="$OVMF_CODE"
